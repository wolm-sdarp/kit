# Профиль «beta»: баннер версии под навбаром. Сборка: quarto render --profile beta
# Текст — wolm.strings.release-beta (_meta-ru/rd/en.yml); стиль — html/scss/partials/_announcement.scss.
# В проекте-книге баннер задаётся в website:, не в book: (book.announcement Quarto 1.9.37 игнорирует).
website:
  announcement:
    content: "{{< meta wolm.strings.release-beta >}}"
    type: info
    icon: info-circle
    dismissable: false
    position: below-navbar
